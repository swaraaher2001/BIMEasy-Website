name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BIMEasy Website/bimeasy/package-lock.json
      - name: Install dependencies
        working-directory: BIMEasy Website/bimeasy
        run: npm ci
      - name: Build site
        working-directory: BIMEasy Website/bimeasy
        run: npm run build
      - name: Support direct links on GitHub Pages
        run: cp "BIMEasy Website/bimeasy/dist/index.html" "BIMEasy Website/bimeasy/dist/404.html"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: BIMEasy Website/bimeasy/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
